name: update-app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
  push:
    branches:
      - 'master'
  pull_request:
    paths:
      - '.github/workflows/update-app.yml'
      - 'build.properties'

jobs:
  update:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    environment: update-app # secrets are gated by this environment
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      -
        name: GitHub auth token from GitHub App
        id: write-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PORTAPPS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PORTAPPS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.write-app.outputs.token }}
          fetch-depth: 0
          persist-credentials: false
      -
        name: Update TeamSpeak 3 Client
        id: update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: &update-script |
            const fs = require('fs');
            const path = require('path');

            const feedUrl = 'https://www.teamspeak.com/versions/client.json';
            const response = await fetch(feedUrl);
            if (!response.ok) {
              throw new Error(`Failed to fetch ${feedUrl}: ${response.status}`);
            }
            const latest = (await response.json()).windows?.x86_64;
            const latestVersion = latest?.version;
            const win64Url = `https://files.teamspeak-services.com/releases/client/${latestVersion}/TeamSpeak3-Client-win64-${latestVersion}.exe`;
            if (!/^\d+(?:\.\d+){2}$/.test(latestVersion) || latest.mirrors?.['teamspeak.com'] !== win64Url) {
              throw new Error(`Invalid TeamSpeak 3 Windows release in ${feedUrl}`);
            }

            const propertyPath = path.join(process.env.GITHUB_WORKSPACE, 'build.properties');
            const content = fs.readFileSync(propertyPath, 'utf8');
            function property(name) {
              const match = content.match(new RegExp(`^${name.replaceAll('.', '\\.')}\\s*=\\s*(.+)$`, 'm'));
              if (!match) {
                throw new Error(`Missing ${name} in build.properties`);
              }
              return match[1].trim();
            }

            const currentVersion = property('app.version');
            const currentRelease = Number(property('app.release'));
            if (!/^\d+(?:\.\d+){2}$/.test(currentVersion) || !Number.isInteger(currentRelease)) {
              throw new Error('Invalid app.version or app.release in build.properties');
            }
            const currentParts = currentVersion.split('.').map(Number);
            const latestParts = latestVersion.split('.').map(Number);
            const comparison = latestParts.findIndex((part, index) => part !== currentParts[index]);
            if (comparison !== -1 && latestParts[comparison] < currentParts[comparison]) {
              throw new Error(`Download page version ${latestVersion} is older than ${currentVersion}`);
            }

            if (comparison !== -1) {
              for (const arch of ['win32', 'win64']) {
                const url = `https://files.teamspeak-services.com/releases/client/${latestVersion}/TeamSpeak3-Client-${arch}-${latestVersion}.exe`;
                const installer = await fetch(url, { method: 'HEAD' });
                if (!installer.ok) {
                  throw new Error(`Installer unavailable: ${url} (${installer.status})`);
                }
              }
              const updated = content
                .replace(/^(app\.version\s*=\s*).+$/m, (_, prefix) => `${prefix}${latestVersion}`)
                .replace(/^(app\.release\s*=\s*).+$/m, (_, prefix) => `${prefix}${currentRelease + 1}`);
              fs.writeFileSync(propertyPath, updated, 'utf8');
              core.info(`Updated TeamSpeak 3 Client from ${currentVersion} to ${latestVersion}`);
            } else {
              core.info(`TeamSpeak 3 Client ${currentVersion} is already up to date`);
            }

            core.setOutput('title', `TeamSpeak 3 Client ${latestVersion}`);
            core.setOutput('version', latestVersion);
      -
        name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: update-teamspeak-client
          token: ${{ steps.write-app.outputs.token }}
          commit-message: ${{ steps.update.outputs.title }}
          title: ${{ steps.update.outputs.title }}
          signoff: true
          sign-commits: true
          delete-branch: true
          body: |
            This updates TeamSpeak 3 Client to ${{ steps.update.outputs.version }}.

  diff:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        name: Update TeamSpeak 3 Client
        id: update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: *update-script
      -
        name: Show diff
        shell: pwsh
        run: |
          $diff = git --no-pager diff -- build.properties
          if ($diff) {
            $diff
          } else {
            Write-Host "No update diff."
          }
